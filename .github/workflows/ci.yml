name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install (runtime + dev group)
        run: uv pip install --system -e . --group dev
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
