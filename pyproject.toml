[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remote-agent-toolkit"
version = "0.0.1"
description = "Define and run remote/background coding agents (Claude Code, Codex) locally and on Gemini Agent Runtime."
readme = "README.md"
requires-python = ">=3.12,<3.14"
# One install pulls everything (local + Gemini Agent Runtime) — no extras to choose. None
# of these are hard to install, so keeping the surface flat beats making teams guess which
# extra they need. Backend imports stay lazy, so `import remote_agent_toolkit` is still fast.
dependencies = [
    "claude-agent-sdk>=0.2.119",  # task-lifecycle messages + stderr callback + effort option
    "openai-codex>=0.144.4",  # Codex harness; bundles a pinned codex CLI (openai-codex-cli-bin)
    "google-adk>=1.5",  # floor of the agentplatform AdkApp template (it raises below 1.5.0)
    "google-cloud-aiplatform[adk,agent-engines]>=1.154",
    "google-cloud-storage",
    "google-cloud-logging",
    "google-cloud-pubsub",
    "a2a-sdk>=0.3.4,<0.4",
    "uv>=0.5",
    "pyyaml",
    "jsonschema",
]

# Dev tooling lives in a dependency group (PEP 735), not an install extra: `pip install
# git+…` (or the github URL) gets a clean runtime install; developers add tooling with
# `uv sync` / `uv pip install --group dev`.
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    # Pinned to the CI-green series: 0.16 added rules (RUF022, UP035/41, S110, ...)
    # that flag ~76 pre-existing spots. Bump together with that cleanup.
    "ruff<0.16",
    "mypy",
    "taskipy>=1.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["remote_agent_toolkit"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.taskipy.tasks]
test = { cmd = "ENV_FOR_DYNACONF=testing pytest -vv" }