[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-run"
version = "0.4.0"
description = "Define and run remote/background coding agents (Claude Code, Codex) locally and in Gemini Enterprise Agent Platform sandboxes."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Konstantin Lopuhin" },
    { name = "Ivan Sanchez" },
    { name = "Julia Medina" },
]
keywords = ["agent", "claude-code", "codex", "sandbox", "llm", "remote-execution"]
classifiers = [
    "Environment :: Console",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
[project.urls]
Homepage = "https://github.com/zytedata/harness-run"
Documentation = "https://github.com/zytedata/harness-run/tree/main/docs"
Changelog = "https://github.com/zytedata/harness-run/blob/main/CHANGELOG.md"
Issues = "https://github.com/zytedata/harness-run/issues"
Source = "https://github.com/zytedata/harness-run"

# The base install covers the remote path (deploy + drive sandbox engines); the harness
# SDKs live in the `local` extra below. Backend imports stay lazy, so
# `import harness_run` is still fast.
dependencies = [
    # The Agent Sandbox surface (client.sandboxes / client.runtimes) is in the 2.x client.
    "google-cloud-agentplatform>=2.1",
    "google-cloud-storage",
    "google-auth",
    # Image builds resolve spec.packages against the base requirements (PEP 508 parsing).
    "packaging",
    "uv>=0.5",
    "pyyaml",
    "jsonschema",
]

[project.optional-dependencies]
# LOCAL in-process execution (`local.deploy`) runs the harness SDKs on your machine.
# The remote path doesn't need them client-side: the sandbox image installs
# claude-agent-sdk from its own baked requirements (runtime/sandbox/_image.py), which
# stay pinned regardless of this extra. Kept out of the base install because the SDKs drag in heavyweight or
# conflicting pins (claude-agent-sdk requires mcp<2, which blocks apps on the mcp 2.x
# SDK; openai-codex bundles the codex CLI binary).
local = [
    "claude-agent-sdk==0.2.130",  # matches the image pin; validated on both runtimes
    "openai-codex==0.147.0",  # custom-provider config used by the OpenRouter route
]

# Dev tooling lives in a dependency group (PEP 735), not an install extra: `pip install
# git+…` (or the github URL) gets a clean runtime install; developers add tooling with
# `uv sync` / `uv pip install --group dev`.
[dependency-groups]
dev = [
    # The suite exercises both harnesses, so the dev group carries the `local` extra's
    # SDKs too — keep these two lines in lockstep with [project.optional-dependencies].
    "claude-agent-sdk==0.2.130",
    "openai-codex==0.147.0",
    "pytest",
    "pytest-asyncio",
    # Pinned to the CI-green series: 0.16 added rules (RUF022, UP035/41, S110, ...)
    # that flag ~76 pre-existing spots. Bump together with that cleanup.
    "ruff<0.16",
    "mypy",
    # `make test` runs -n auto; the suite is process-parallel safe (each worker is its own
    # process, so the autouse fixtures and the signal test stay isolated).
    "pytest-xdist",
]

[project.scripts]
# One-command GCP project setup for the sandbox backend (audit -> confirm -> apply);
# see the README's "GCP setup & required permissions" section.
harness-run-gcp-setup = "harness_run.runtime.sandbox.project_setup:main"

[tool.hatch.build.targets.wheel]
packages = ["harness_run"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
