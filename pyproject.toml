[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remote-agent-toolkit"
version = "0.0.1"
description = "Define and run remote/background Claude-Code agents locally and on Gemini Agent Runtime."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "claude-agent-sdk>=0.2",
    "google-adk>=1.0",
]

[project.optional-dependencies]
gemini = [
    "google-cloud-aiplatform[adk,agent-engines]>=1.110",
    "google-cloud-storage",
    "google-cloud-logging",
    "uv>=0.5",
    "a2a-sdk>=0.3.4,<0.4",
]
pubsub = [
    "google-cloud-pubsub",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["remote_agent_toolkit"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
